      summary: General ledger for an account with running balance
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Ledger, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /finance/reports/trial-balance:
    get:
      tags: [Finance]
      summary: Trial balance (must net to zero)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Trial balance, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /finance/payables:
    get:
      tags: [Finance]
      summary: Supplier invoices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invoices, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /finance/payables/{invoice}/post:
    post:
      tags: [Finance]
      summary: Post supplier invoice to GL (Dr expense lines, Cr AP)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: invoice, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Posted }, '422': { description: Invalid state } }
  /finance/receivables:
    get:
      tags: [Finance]
      summary: Customer invoices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invoices, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /finance/receivables/{invoice}/post:
    post:
      tags: [Finance]
      summary: Post customer invoice to GL (Dr AR, Cr revenue + tax)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: invoice, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Posted }, '422': { description: Invalid state } }
  /finance/payments:
    post:
      tags: [Finance]
      summary: Record a payment and allocate to a document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, method, amount, payment_date, document_type, document_id]
              properties:
                direction: { type: string, enum: [in, out] }
                method: { type: string }
                amount: { type: number }
                payment_date: { type: string, format: date }
                bank_account_id: { type: integer }
                document_type: { type: string, enum: [supplier_invoice, customer_invoice, expense_claim] }
                document_id: { type: integer }
      responses:
        '201': { description: Payment recorded and allocated }
        '422': { description: Overpayment or invalid document }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string, example: XERIN-ATT-2026-000001 }
        work_date: { type: string, format: date }
        clock_in_at: { type: string, format: date-time, nullable: true }
        clock_out_at: { type: string, format: date-time, nullable: true }
        worked_minutes: { type: integer }
        late_minutes: { type: integer }
        status: { type: string, enum: [present, absent, late, half_day, on_leave, holiday, rest_day, pending_verification] }
    LeaveRequest:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string, example: XERIN-LEV-2026-000001 }
        type: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        days: { type: number }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
    LeaveBalance:
      type: object
      properties:
        leave_type_id: { type: integer }
        year: { type: integer }
        entitled: { type: number }
        carried_forward: { type: number }
        used: { type: number }
        pending: { type: number }
        available: { type: number }

    Ticket:
      type: object
      properties:
        id: { type: integer }
        ticket_number: { type: string, example: XERIN-TKT-2026-000001 }
        subject: { type: string }
        description: { type: string }
        type: { type: string, nullable: true }
        priority: { type: string, enum: [low, normal, high, urgent, critical] }
        status: { type: string, enum: [new, submitted, under_review, assigned, in_progress, pending, resolved, closed, reopened] }
        requester: { type: string }
        assigned_agent: { type: string, nullable: true }
        assigned_team: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    TicketTask:
      type: object
      properties:
        id: { type: integer }
        task_number: { type: string, example: XERIN-TSK-2026-000001 }
        title: { type: string }
        status: { type: string }
        progress: { type: integer }
        due_date: { type: string, format: date, nullable: true }
    ServiceCatalogItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        requires_approval: { type: boolean }
        approval_chain: { type: array, items: { type: string } }
        expected_hours: { type: integer, nullable: true }

    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: object, nullable: true }

    CompanyInput:
      type: object
      required: [code, legal_name, company_type]
      properties:
        code: { type: string, maxLength: 30 }
        legal_name: { type: string }
        trading_name: { type: string }
        company_type: { type: string, enum: [holding, subsidiary, associate, entity] }
        parent_company_id: { type: integer, nullable: true }
        registration_number: { type: string }
        tax_identification_number: { type: string }
        vat_number: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        website: { type: string, format: uri }
        country: { type: string }
        region: { type: string }
        district: { type: string }
        city: { type: string }
        physical_address: { type: string }
        postal_address: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string }
        operational_start_date: { type: string, format: date }

    BranchInput:
      type: object
      required: [company_id, name, code, branch_type]
      properties:
        company_id: { type: integer }
        name: { type: string }
        code: { type: string, maxLength: 30 }
        branch_type: { type: string, enum: [head_office, regional_office, branch, warehouse, site] }
        contact_person: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        country: { type: string }
        region: { type: string }
        district: { type: string }
        city: { type: string }
        physical_address: { type: string }
        postal_address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        opening_date: { type: string, format: date }
        description: { type: string }

    LocationInput:
      type: object
      required: [company_id, name, code, location_type]
      properties:
        company_id: { type: integer }
        branch_id: { type: integer, nullable: true }
        name: { type: string }
        code: { type: string, maxLength: 30 }
        location_type: { type: string, enum: [head_office, regional_office, branch_office, warehouse, site, other] }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    DepartmentInput:
      type: object
      required: [company_id, code, name]
      properties:
        department_definition_id: { type: integer, nullable: true }
        company_id: { type: integer }
        branch_id: { type: integer, nullable: true }
        parent_id: { type: integer, nullable: true }
        code: { type: string, maxLength: 30 }
        name: { type: string }
        description: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        effective_date: { type: string, format: date }

    RegistrationInput:
      type: object
      required: [first_name, last_name, email, phone]
      properties:
        first_name: { type: string, maxLength: 100 }
        middle_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        alt_phone: { type: string, maxLength: 30 }
        date_of_birth: { type: string, format: date }
        residential_address: { type: string }
        employee_number: { type: string, maxLength: 50 }
        employment_type: { type: string, enum: [permanent, contract, temporary, intern, consultant] }
        job_title: { type: string }
        requested_company_id: { type: integer, nullable: true, description: "Request only — IT assigns authoritatively" }
        requested_branch_id: { type: integer, nullable: true }
        requested_department_id: { type: integer, nullable: true }
        employment_start_date: { type: string, format: date }
        registration_reason: { type: string }

    ProvisionInput:
      type: object
      required: [company_id, role]
      properties:
        company_id: { type: integer }
        branch_id: { type: integer, nullable: true }
        department_id: { type: integer, nullable: true }
        position: { type: string }
        manager_user_id: { type: integer, nullable: true }
        employee_number: { type: string, description: "Auto-generated XER-##### when omitted" }
        employment_type: { type: string }
        effective_start: { type: string, format: date }
        role: { type: string, description: "Protected roles (super-admin) are rejected" }

    EmployeeInput:
      type: object
      required: [first_name, last_name, employment_type]
      properties:
        first_name: { type: string, maxLength: 100 }
        middle_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        employment_type: { type: string, enum: [permanent, contract, temporary, probation, intern, part_time, consultant] }
        employee_number: { type: string, description: "Optional — auto-generated when omitted" }
        user_id: { type: integer, nullable: true, description: "Link to a provisioned ERP account" }
        company_id: { type: integer, nullable: true }
        branch_id: { type: integer, nullable: true }
        department_id: { type: integer, nullable: true }
        job_position_id: { type: integer, nullable: true }
        manager_employee_id: { type: integer, nullable: true }
        start_date: { type: string, format: date }
        official_email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }

  responses:
    Unauthenticated:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, message: Unauthenticated. }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, message: Forbidden. }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            message: Validation failed.
            errors: { email: ["The provided credentials are incorrect."] }

security:
  - bearerAuth: []
