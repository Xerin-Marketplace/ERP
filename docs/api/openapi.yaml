openapi: 3.0.3

info:
  title: XERIN GROUP ERP — Platform API
  version: 1.0.0
  description: |
    Central API for the XERIN GROUP ERP platform (Phase 0).
    All responses follow the shared contract:
    `{ "success": bool, "message": string, "data": mixed }`
  contact:
    name: Xerin Group Company Limited

servers:
  - url: https://xerinhub.com/api/v1
  - url: http://localhost:8000/api/v1

tags:
  - name: Platform
  - name: Auth
  - name: Organization
  - name: Identity
  - name: Employee
  - name: Ticketing
  - name: Tasks
  - name: Service Catalog
  - name: HR

paths:
  /health:
    get:
      tags: [Platform]
      summary: Platform health probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: Service healthy
                data:
                  status: healthy
                  checks:
                    database: { status: ok }
                    cache: { status: ok }
                    storage: { status: ok }

  /auth/token:
    post:
      tags: [Auth]
      summary: Issue an API token (Sanctum)
      operationId: issueToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: api }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example:
                success: true
                message: Token issued
                data: { token: "1|abc...", token_type: Bearer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getMe
      responses:
        '200':
          description: User with roles and permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/revoke:
    post:
      tags: [Auth]
      summary: Revoke current token
      operationId: revokeToken
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /core/status:
    get:
      tags: [Platform]
      summary: Module engine status
      operationId: getModuleStatus
      responses:
        '200':
          description: Registered modules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /organization/overview:
    get:
      tags: [Organization]
      summary: Organization dashboard metrics
      operationId: orgOverview
      description: Database-driven counts and distributions for the org dashboard.
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organization/structure:
    get:
      tags: [Organization]
      summary: Hierarchical organization tree
      operationId: orgStructure
      responses:
        '200':
          description: Nested tree of companies → subsidiaries/branches → departments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organization/audit-logs:
    get:
      tags: [Organization]
      summary: Organization audit history
      operationId: orgAuditLogs
      parameters:
        - { name: resource, in: query, schema: { type: string, enum: [company, branch, location, department] } }
        - { name: action, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organization/companies:
    get:
      tags: [Organization]
      summary: List companies
      operationId: listCompanies
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [holding, subsidiary, associate, entity] } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, archived] } }
        - { name: parent_id, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, default: 15 } }
      responses:
        '200':
          description: Paginated companies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      summary: Create company
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/companies/{company}:
    get:
      tags: [Organization]
      summary: Company details (with subsidiaries, branches, departments)
      operationId: getCompany
      parameters:
        - { name: company, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
    put:
      tags: [Organization]
      summary: Update company
      operationId: updateCompany
      parameters:
        - { name: company, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/branches:
    get:
      tags: [Organization]
      summary: List branches
      operationId: listBranches
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: region, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, archived] } }
        - { name: per_page, in: query, schema: { type: integer, default: 15 } }
      responses:
        '200':
          description: Paginated branches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      summary: Create branch
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/branches/{branch}:
    get:
      tags: [Organization]
      summary: Branch details
      operationId: getBranch
      parameters:
        - { name: branch, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    put:
      tags: [Organization]
      summary: Update branch
      operationId: updateBranch
      parameters:
        - { name: branch, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/locations:
    get:
      tags: [Organization]
      summary: List locations
      operationId: listLocations
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    post:
      tags: [Organization]
      summary: Create location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/departments:
    get:
      tags: [Organization]
      summary: List departments
      operationId: listDepartments
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: branch_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, archived] } }
      responses:
        '200':
          description: Paginated departments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    post:
      tags: [Organization]
      summary: Create department
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/departments/{department}:
    get:
      tags: [Organization]
      summary: Department details
      operationId: getDepartment
      parameters:
        - { name: department, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    put:
      tags: [Organization]
      summary: Update department (supports parent transfers)
      operationId: updateDepartment
      parameters:
        - { name: department, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /organization/{entity}/{id}/status:
    post:
      tags: [Organization]
      summary: Change entity status (activate / suspend / archive)
      operationId: orgSetStatus
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, enum: [companies, branches, locations, departments] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, archived] }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity/register:
    post:
      tags: [Identity]
      summary: Submit a public registration application
      operationId: submitRegistration
      description: |
        Creates a registration **application** only — never an ERP account.
        Every application enters the IT review workflow. Rate-limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
      responses:
        '201':
          description: Application received — save the reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example:
                success: true
                message: Application received. Save your reference number to track its status.
                data: { reference: XERIN-REG-2026-000001, status: submitted }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Rate limited

  /identity/registration/status/{reference}:
    get:
      tags: [Identity]
      summary: Public application status lookup
      operationId: registrationStatus
      description: Requires the application reference AND the applicant's email (anti-enumeration + rate limited).
      security: []
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string }, example: XERIN-REG-2026-000001 }
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        '200':
          description: Public-safe status (no internal notes exposed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: Not found
        '429':
          description: Rate limited

  /identity/me:
    get:
      tags: [Identity]
      summary: Current user's identity, profile and placement
      operationId: identityMe
      responses:
        '200':
          description: User + profile + current assignment + roles/permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /identity/admin/registrations:
    get:
      tags: [Identity]
      summary: List registration applications (IT)
      operationId: adminListRegistrations
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [submitted, pending_review, under_review, information_requested, approved, rejected, provisioning, active, cancelled] } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Paginated applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /identity/admin/registrations/{application}:
    get:
      tags: [Identity]
      summary: Application details with documents, timeline and internal reviews
      operationId: adminGetRegistration
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /identity/admin/registrations/{application}/review:
    post:
      tags: [Identity]
      summary: Add an internal review note
      operationId: adminReviewRegistration
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties: { note: { type: string } }
      responses:
        '200': { description: Note recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /identity/admin/registrations/{application}/request-information:
    post:
      tags: [Identity]
      summary: Request additional information from the applicant
      operationId: adminRequestInfo
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties: { message: { type: string } }
      responses:
        '200': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity/admin/registrations/{application}/approve:
    post:
      tags: [Identity]
      summary: Approve an application under review
      operationId: adminApproveRegistration
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity/admin/registrations/{application}/reject:
    post:
      tags: [Identity]
      summary: Reject an application (reason required)
      operationId: adminRejectRegistration
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 5 } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /identity/admin/registrations/{application}/provision:
    post:
      tags: [Identity]
      summary: Assign organizationally and provision the account
      operationId: adminProvision
      description: |
        Validates the placement against the Organization module, creates the user
        (status `pending`), records assignment history, assigns the role and
        emails a 72-hour single-use activation invitation.
      parameters:
        - { name: application, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionInput' }
      responses:
        '200': { description: Provisioned, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /identity/admin/users:
    get:
      tags: [Identity]
      summary: List users
      operationId: adminListUsers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, active, suspended, deactivated] } }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /identity/admin/users/{user}:
    get:
      tags: [Identity]
      summary: User details incl. assignment & login history
      operationId: adminGetUser
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /identity/admin/users/{user}/suspend:
    post:
      tags: [Identity]
      summary: Suspend account (revokes sessions and API tokens)
      operationId: adminSuspendUser
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200': { description: Suspended, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /identity/admin/users/{user}/activate:
    post:
      tags: [Identity]
      summary: Activate account
      operationId: adminActivateUser
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /identity/admin/roles:
    get:
      tags: [Identity]
      summary: List roles with permissions (protected roles excluded)
      operationId: adminListRoles
      responses:
        '200': { description: Roles, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /employees:
    get:
      tags: [Employee]
      summary: Scoped employee directory
      operationId: listEmployees
      description: Results are scoped by the caller's permission and organizational placement.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [onboarding, active, suspended, separated] } }
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: branch_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: position_id, in: query, schema: { type: integer } }
        - { name: employment_type, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Paginated employees, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Employee]
      summary: Create an employee record
      operationId: createEmployee
      description: Auto-generates `XERIN-EMP-YYYY-######`. Placement is validated against Organization rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /employees/dashboard:
    get:
      tags: [Employee]
      summary: Workforce metrics (scoped)
      operationId: employeeDashboard
      responses:
        '200': { description: Metrics + distributions, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /employees/{employee}:
    get:
      tags: [Employee]
      summary: Employee profile
      operationId: getEmployee
      parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Profile + placement + contract, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Employee]
      summary: Update employee (governed fields only)
      operationId: updateEmployee
      parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /employees/{employee}/documents:
    get:
      tags: [Employee]
      summary: List employee documents
      operationId: listEmployeeDocuments
      parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Documents, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      tags: [Employee]
      summary: Upload an employee document (private storage)
      operationId: uploadEmployeeDocument
      parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category_id, title, file]
              properties:
                category_id: { type: integer }
                title: { type: string }
                expires_at: { type: string, format: date }
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /employees/{employee}/history:
    get:
      tags: [Employee]
      summary: Employee event timeline
      operationId: employeeHistory
      parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Events, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }

  /employees/{employee}/reporting:
    get:
